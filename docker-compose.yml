services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ambush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ambushiq}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ambush} -d ${POSTGRES_DB:-ambushiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ambush}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ambushiq}
      APP_TOKEN: ${APP_TOKEN:-unused}
      # used to derive the encryption key for stored camera credentials
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CAMERA_IMAGE_DIR: /app/data/camera_images
      # optional: DETECTOR_MODE=fallback to skip MegaDetector if too heavy on this host
      DETECTOR_MODE: ${DETECTOR_MODE:-megadetector}
      MEGADETECTOR_MODEL: ${DETECTOR_MODEL:-MDV6-yolov10-c}
      DETECTOR_CONF: ${DETECTOR_CONF:-0.2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${CAMERA_IMAGE_PATH:-./data/camera_images}:/app/data/camera_images
    # Published to the host so your existing nginx reverse proxy can reach it.
    # APP_BIND defaults to 127.0.0.1 (loopback only) — correct when nginx runs on
    # the same host. If nginx is on a different machine, set APP_BIND=0.0.0.0 in
    # .env and firewall the port so only the proxy host can reach it.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"

volumes:
  dbdata:
