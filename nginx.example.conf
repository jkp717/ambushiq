# Example server block for your existing nginx reverse proxy.
# Adjust server_name, the upstream address, and your TLS cert paths.
#
# If nginx runs on the SAME host as the Docker stack, the app is published on
# 127.0.0.1:8000 (default APP_BIND), so proxy_pass to 127.0.0.1:8000.
# If nginx is on a DIFFERENT host, set APP_BIND=0.0.0.0 in .env and point
# proxy_pass at the Docker host's LAN IP (e.g. http://192.168.1.50:8000).

upstream ambushiq {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hunt.example.com;

    # ── Your existing TLS setup ──
    ssl_certificate     /etc/letsencrypt/live/hunt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hunt.example.com/privkey.pem;

    # Terrain analysis fetches an elevation grid server-side; give it room.
    proxy_read_timeout 60s;
    client_max_body_size 2m;

    location / {
        proxy_pass http://ambushiq;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name hunt.example.com;
    return 301 https://$host$request_uri;
}
